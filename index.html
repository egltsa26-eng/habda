    const r = vals(p.res);
    return `<main class="stage center split">${head(p, sub)}<div class="col-a"><p class="eyebrow">${nm(p.asker)} اختار ${nm(r.pick)}</p>
      <h1 class="verdict ${r.right ? 'good' : 'bad'} pop">${r.right ? `صاده! ${nm(r.truth)} هو الصادق` : `طاحت عليه! الصادق كان ${nm(r.truth)}`}</h1>
      <p class="reveal-line">الجواب الصح: <b>${h(r.a)}</b></p></div><div class="col-b">${pointsBoard(p, r.d)}${hostBtn('next', p.kk + 1 >= p.total ? 'شوفوا النتيجة' : 'الدور اللي بعده')}</div></main>`;
  }
  function vHlR(p, me, pv) {
    const o = list(p.order), sub = `${nm(p.hot)} على الكرسي الحار · سؤال ${p.n + 1} من ${p.per}`, unit = n => withUnit(n, p.kind, p.u);
    if (p.st === 'say') {
      if (pv && pv.hot) return `<main class="stage center split">${head(p, sub)}<div class="col-a">${qcard('hl', 'سؤالك', pv.q)}
        <div class="secret pop"><span class="secret-label">الجواب الحقيقي</span><span class="secret-word mid">${h(unit(pv.a))}</span></div></div>
        <div class="col-b"><p class="label">اختار الرقم اللي بتقوله لهم:</p>
        <div class="actions"><button class="btn soft num" data-act="r-say" data-v="${pv.lo}">${h(fmtN(pv.lo, p.kind))}<small>أقل من الحقيقي</small></button><button class="btn soft num" data-act="r-say" data-v="${pv.hi}">${h(fmtN(pv.hi, p.kind))}<small>أعلى من الحقيقي</small></button></div>
        <div class="form"><label class="label" for="r-own">أو اكتب رقم من عندك</label><div class="inline"><input type="text" id="r-own" inputmode="decimal" autocomplete="off"><button class="btn soft" data-act="r-own">اعتمد</button></div></div></div></main>`;
      return `<main class="stage center">${head(p, sub)}${avU(p.hot, 'lg')}<p class="title sm">${nm(p.hot)} يختار رقم يلخبطكم</p>${RM.host ? `<button class="btn flat" data-act="r-do" data-t="skip">اختاروا له رقم وكمّلوا</button>` : ''}</main>`;
    }
    if (p.st === 'vote') {
      const done = list(p.voted), voters = o.filter(u => u !== p.hot), left = voters.filter(u => !done.includes(u));
      const top = `<div class="col-a">${qcard('hl', 'السؤال', p.q)}<div class="said"><span>${nm(p.hot)} يقول</span><b>${h(unit(p.said))}</b></div></div>`;
      if (pv && !pv.hot && !pv.dir) return `<main class="stage center split">${head(p, sub)}${top}<div class="col-b"><p class="hint">الجواب الحقيقي أعلى ولا أقل؟</p><div class="actions"><button class="btn primary big" data-act="r-dir" data-v="up">أعلى ↑</button><button class="btn team-1 big" data-act="r-dir" data-v="down">أقل ↓</button></div></div></main>`;
      return `<main class="stage center split">${head(p, sub)}${top}<div class="col-b"><p class="title sm">${pv && pv.hot ? 'حاول تقنعهم برقمك' : (pv && pv.dir ? `اخترت: ${pv.dir === 'up' ? 'أعلى ↑' : 'أقل ↓'}` : 'كل واحد يختار من جواله')}</p>${progress(voters, done)}${skipBtn(left)}</div></main>`;
    }
    const r = vals(p.res), votes = vals(r.votes);
    return `<main class="stage center split">${head(p, sub)}<div class="col-a"><p class="eyebrow">${h(p.q)}</p><p class="reveal-line">${nm(p.hot)} قال <b>${h(unit(p.said))}</b></p>
      <h1 class="verdict pop">الجواب الحقيقي: ${h(unit(r.a))}</h1></div>
      <div class="col-b"><div class="hl-votes">${o.filter(u => u !== p.hot).map(u => { const v = votes[u], ok = v && (v === 'up') === r.up; return `<div class="hl-row">${avU(u, 'sm')}<span class="nm">${nm(u)}<small>${v ? (v === 'up' ? 'أعلى ↑' : 'أقل ↓') : 'ما صوّت'}</small></span><span class="res ${ok ? 'ok' : 'no'}">${ok ? 'صح، +1' : 'غلط'}</span></div>`; }).join('')}</div>
      ${pointsBoard(p, r.d)}${hostBtn('next', 'اللي بعده')}</div></main>`;
  }
  function vSummaryR(p) {
    const o = list(p.order), pts = vals(p.pts), ranked = o.slice().sort((a, b) => (pts[b] || 0) - (pts[a] || 0)), topP = ranked.length ? (pts[ranked[0]] || 0) : 0, win = ranked.filter(u => (pts[u] || 0) === topP);
    return `<main class="stage center split">${topP ? confetti() : ''}<div class="col-a">${emb(p.k, 'end-emb')}<p class="eyebrow">انتهت لعبة «${MODE_NAMES[p.k]}»</p>
      <h1 class="winner pop">${!topP ? 'ما أحد سجّل نقاط' : (win.length > 1 ? 'تعادل: ' + win.map(nm).join(' و') : 'فاز ' + nm(win[0]) + '!')}</h1></div>
      <div class="col-b">${pointsBoard(p)}${RM.host ? `<button class="btn primary big" data-act="r-do" data-t="lobby">ارجعوا للغرفة</button>` : (RM.tv ? '' : '<p class="hint">الليدر بيرجعكم للغرفة.</p>')}</div></main>`;
  }
  function vRoom() {
    const p = RM.pub;
    if (!RM.code) return vNet();
    if (!p) return `<main class="stage center"><p class="title sm">نتصل بالغرفة...</p></main>`;
    const hostOff = RM.meta && RM.players[RM.meta.host] && RM.players[RM.meta.host].on === false && !RM.host ? '<p class="warn full">الليدر طاح من النت. انتظروا يرجع.</p>' : '';
    let body;
    if (p.view === 'lobby') body = RM.tv ? tvLobby(p) : vLobby(p);
    else if (p.view === 'summary') body = vSummaryR(p);
    else if (RM.tv) body = { odd: vOddR, imp: vImpR, bluff: vBluffR, hl: vHlR }[p.k](p, '', null);
    else if (!list(p.order).includes(RM.me)) body = notIn(p);
    else {
      const me = RM.me, pv = RM.priv;
      body = { odd: vOddR, imp: vImpR, bluff: vBluffR, hl: vHlR }[p.k](p, me, pv);
      if (RM.host) body = body.replace(/<\/main>$/, `<div class="actions full"><button class="btn flat" data-act="r-do" data-t="end">${RM.armed > Date.now() ? 'متأكد؟ اضغط مرة ثانية' : 'أنهِ اللعبة وارجعوا للغرفة'}</button></div></main>`);
    }
    if (RM.tv && p.view !== 'lobby') body = body.replace(/<\/main>$/, `<div class="actions full"><button class="btn flat" data-act="r-leave">سكّروا شاشة العرض</button></div></main>`);
    const timing = p.view === 'game' && p.k === 'imp' && p.st === 'ask';
    if (timing && RM.askSeq !== p.seq) { RM.askSeq = p.seq; S.tTotal = (vals(p.set).impMin || 3) * 60000; S.tEnd = Date.now() + Math.max(0, (p.ends || 0) - (p.now || 0)); S.tBeeped = false; S.tLastSec = 0; }
    else if (!timing && S.tEnd) { RM.askSeq = 0; stopTimer(); }
    return hostOff ? body.replace(/(<main[^>]*>)/, '$1' + hostOff) : body;
  }
  Object.assign(views, { net: vNet, room: vRoom });

  /* --- moves --- */
  Object.assign(act, {
    'r-home': () => { if (RM.code) go('room'); else go('net'); },
    'r-create': () => { RM.name = clean((document.getElementById('r-name') || {}).value || RM.name, 18); try { mem.setItem(NAME_KEY, RM.name); } catch (e) {} createRoom(); },
    'r-join': () => { RM.name = clean((document.getElementById('r-name') || {}).value || RM.name, 18); try { mem.setItem(NAME_KEY, RM.name); } catch (e) {} const c = (document.getElementById('r-code') || {}).value || RM.joinCode; RM.joinCode = c; joinRoom(c); },
    'r-tv': () => { const c = (document.getElementById('r-tv') || {}).value || RM.tvCode; RM.tvCode = c; joinTV(c); },
    'r-share': () => {
      const url = joinUrl(RM.code), text = `تعال العب معنا «هبدة». رمز الغرفة ${RM.code}`;
      try { if (isNative()) { quiet(nativeApi().Share.share({ title: 'هبدة', text, url })); return; } } catch (e) {}
      try { if (navigator.share) { quiet(navigator.share({ title: 'هبدة', text, url })); return; } } catch (e) {}
      try { navigator.clipboard.writeText(text + '\n' + url).then(() => toast('انسخ الرابط'), () => toast(url)); } catch (e) { toast(url); }
    },
    'r-set': el => {
      if (!RM.host || !HS) return;
      const [k, v] = String(el.dataset.v).split(':');
      if (k === 'impCat' && locked(Rules.impCat(v))) { openPlus(); return; }
      HS.set[k] = /^\d+$/.test(v) ? Number(v) : v; hostPublish();
    },
    'r-start': () => { if (RM.host) hostStart(); },
    'r-kick': el => { if (!RM.host) return; const u = el.dataset.u; RM.drv.set(rp('kicked/' + u), true).then(() => RM.drv.remove(rp('players/' + u))).catch(() => {}); },
    'r-leave': () => {
      if (RM.tv) { leaveLocal('سكّرنا شاشة العرض'); return; }
      if (RM.host) {
        if (RM.armed > Date.now()) { RM.armed = 0; const code = RM.code; RM.drv.remove('rooms/' + code).catch(() => {}); leaveLocal('قفّلنا الغرفة'); return; }
        RM.armed = Date.now() + 4000; render(); setTimeout(() => { if (S.screen === 'room') render(); }, 4100); return;
      }
      RM.drv.remove(rp('players/' + RM.me)).catch(() => {}); leaveLocal('طلعت من الغرفة');
    },
    'r-do': el => {
      const t = el.dataset.t;
      if (t === 'end' && RM.host) { if (RM.armed > Date.now()) { RM.armed = 0; send('end'); } else { RM.armed = Date.now() + 4000; render(); setTimeout(() => { if (S.screen === 'room') render(); }, 4100); } return; }
      send(t); if (t === 'seen') RM.reveal = false;
    },
    'r-reveal': () => { RM.reveal = true; haptic(); render(); },
    'r-peek': () => { RM.reveal = !RM.reveal; render(); },
    'r-sel': el => { RM.sel = el.dataset.u; render(); },
    'r-vote': () => { if (RM.sel) { send('vote', RM.sel); RM.sel = null; } },
    'r-pick': () => { if (RM.sel) { send('pick', RM.sel); RM.sel = null; } },
    'r-guess': el => send('guess', el.dataset.w),
    'r-dir': el => send('dir', el.dataset.v),
    'r-say': el => send('say', Number(el.dataset.v)),
    'r-own': () => {
      const el = document.getElementById('r-own'), n = Number(toLatin(el && el.value)), pv = RM.priv;
      if (!el || !el.value.trim() || !Number.isFinite(n) || n <= 0) { toast('اكتب رقم صحيح'); return; }
      if (pv && n === pv.a) { toast('لازم يكون غير الجواب الحقيقي'); return; }
      send('say', n);
    },
    'r-ans': () => {
      const el = document.getElementById('r-ans'), v = clean(el && el.value, 40);
      if (!v) { toast('اكتب جوابك أول'); if (el) el.focus(); return; }
      if (el) el.blur(); send('ans', v);
    }
  });
  app.addEventListener('input', e => { const id = e.target.id; if (id === 'r-name') RM.name = e.target.value; if (id === 'r-code') RM.joinCode = e.target.value; if (id === 'r-tv') RM.tvCode = e.target.value; });
  app.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.isComposing) return;
    const id = e.target && e.target.id;
    if (id === 'r-ans') { e.preventDefault(); run('r-ans'); }
    else if (id === 'r-own') { e.preventDefault(); run('r-own'); }
    else if (id === 'r-code') { e.preventDefault(); run('r-join'); }
    else if (id === 'r-tv') { e.preventDefault(); run('r-tv'); }
  });
  if (NET_ON) setTimeout(() => {
    const saved = lsGet(ROOM_KEY);
    if (RM.wantTV) { go('net'); if (RM.tvCode) joinTV(RM.tvCode); return; }
    if (RM.joinCode && (!saved || saved.code !== RM.joinCode)) { go('net'); return; }
    if (saved) resumeRoom();
  }, 0);

  function run(name, el) {
    const fn = act[name];
    if (!fn) return;
    try {
      const out = fn(el);
      if (out && typeof out.then === 'function') out.catch(crash);
    } catch (e) { crash(e); }
  }

  let touched = false;
  ['pointerdown', 'touchend', 'keydown'].forEach(type => document.addEventListener(type, unlockAudio, { passive: true }));
  app.addEventListener('click', e => {
    unlockAudio();
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    touched = true;
    run(el.dataset.act, el);
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sheet) run('sheet-close'); });
  app.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.isComposing) return;
    const id = e.target && e.target.id;
    if (id === 'o-ans' || id === 'h-own') { e.preventDefault(); touched = true; run(id === 'o-ans' ? 'o-answer' : 'h-own'); }
  });
  app.addEventListener('input', e => {
    touched = true;
    const t = e.target, id = t.id;
    if (id === 'team-a') S.setup.teamA = t.value;
    else if (id === 'team-b') S.setup.teamB = t.value;
    else if (id === 'sponsor') S.setup.sponsor = t.value;
    else if (id === 'log-people') S.draft.people = t.value;
    else if (id === 'log-note') S.draft.note = t.value;
    else if (id === 'words-in') { const c = document.getElementById('words-count'); if (c) c.textContent = parseWords(t.value).length + ' كلمة'; }
    else if (t.dataset && t.dataset.pid) {
      const p = S.players.find(x => x.id === t.dataset.pid);
      if (p) { p.name = t.value; const a = t.previousElementSibling; if (a && a.classList.contains('av')) a.textContent = avChar(t.value); }
    }
  });
  app.addEventListener('change', persist);

  /* First frame right away. A live page update may then hand back a running game, but only one saved by this same version. */
  render();
  try {
    const st = store();
    if (st) {
      quiet(st.addListener('change', r => { setOwned(r && r.owned); render(); }));
      /* a TV or AirPlay screen shows the phone as it is: in landscape the game fills it */
      quiet(st.addListener('screen', d => { if (d && d.on && window.matchMedia && matchMedia('(orientation: portrait)').matches) toast('الشاشة متوصلة. اقلبوا الجوال بالعرض عشان تعبّي الشاشة'); }));
      quiet(st.owned().then(r => { setOwned(r && r.owned); render(); }));
    }
  } catch (e) {}
  (() => {
    if (DEMO || !window.fetch) return;
    const url = FLAGS.target === 'web' ? 'content.json' : (FLAGS.webUrl ? FLAGS.webUrl + 'content.json' : '');
    if (!url) return;
    fetch(url, { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).then(data => {
      if (!isObj(data)) return;
      try { localStorage.setItem(REMOTE_KEY, JSON.stringify(data)); } catch (e) {}
      if (applyRemote(data)) render();
    }).catch(() => {});
  })();
  stat(isNative() ? 'open_app' : 'open_web');
  /* The iPhone's launch picture and the page's splash are the same picture in the same place, so swapping them is invisible.
     The splash then stays about two seconds from launch, and the games come up. Tapping it skips it. */
  try { if (isNative()) { statusBar(false); requestAnimationFrame(() => setTimeout(() => quiet(nativeApi().SplashScreen.hide({ fadeOutDuration: 150 })), 30)); } } catch (e) {}
  (() => {
    const sp = document.getElementById('splash');
    if (!sp) return;
    let gone = false;
    const drop = () => { if (gone) return; gone = true; sp.classList.add('out'); setTimeout(() => { try { sp.remove(); } catch (e) {} }, 420); };
    const since = window.performance && performance.now ? performance.now() : 0;
    setTimeout(drop, Math.max(700, 2000 - since));
    sp.addEventListener('click', drop);
  })();
  const hot = window.claude && window.claude.hot;
  function boot(data) {
    if (touched || !data || data.v !== SV || !isObj(data.S)) return;
    const prev = S;
    try { S = { ...defaults(), ...data.S }; sanitize(); }
    catch (e) { S = prev; }
    render();
  }
  try { if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ v: SV, S })); } catch (e) {}
  try {
    if (hot && typeof hot.ready === 'function') hot.ready(boot);
    else if (hot) boot(hot.data);
  } catch (e) {}
})();
</script>
</body></html>
